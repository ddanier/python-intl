name: "TEST: Run pytest using tox"
on:
  push:
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install node
        uses: actions/setup-node@v7
      - name: Install the dependencies
        run: uv sync --all-extras --dev
      - name: Output used version
        run: |
          node --version
          python --version
          uv run python -c "import icu; print(icu.__version__)"
          pkg-config --libs icu-i18n
      - name: Test with pytest
        run: |
          uv run tox -e 'py'
