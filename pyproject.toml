[project]
name = "python-intl"
version = "0.8.0"
description = "Python implementation of the Intl JavaScript API"
readme = "README.md"
authors = [
    { name = "David Danier", email = "david.danier@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pyicu>=2.16.2",
]

[project.urls]
Repository = "https://github.com/ddanier/python-intl"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.3",
    "tox>=4.60.0",
    "ty>=0.0.72",
]

[tool.pytest.ini_options]
markers = [
    "unit: mark a test as a unit test",
    "node: mark tests jun against the node/JS implementation",
]

[tool.ruff]
line-length = 115
output-format = "grouped"

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "ANN", # flake8-annotations
    "ARG", # flake8-unused-arguments
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "COM", # flake8-commas
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "TD",  # flake8-todos
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101","ANN201"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.pyright]
pythonVersion = "3.12"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "python_intl"
module-root = ""
